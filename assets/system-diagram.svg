<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1022" viewBox="0 0 900 1022" role="img" aria-labelledby="diagram-title" aria-describedby="diagram-desc">
<title id="diagram-title">How the betting agent works</title>
<desc id="diagram-desc">The system is a loop of five parts. 1. Attempt: a new Claude Code session researches the markets and writes a proposal: its reasoning, a prediction, and the bets it wants. 2. Checks and orders: code checks every bet against fixed rules and money limits, then places the orders. 3. Kalshi exchange: orders fill at the exchange, and every market settles within five days. 4. Ledger: one database holds every attempt, every bet, every rejected bet and every result. 5. Daily review: once a day a Claude Code session ranks yesterday's attempts against one another within their daily cohort, writes guidance, and selects example sets for director and focused attempts. Its guidance and examples go to the next attempts, which can also search past attempts in the ledger. A panel above the Attempt box zooms into it: the scheduler starts 15 attempts a day, and each one is assigned one of four groups at random: 1 baseline, 6 static, 7 director and 1 focused. Each attempt writes one proposal with zero or more bets, and each bet is one market, one side, and 1 to 3 contracts. The four groups differ only in what the attempt reads before it starts. Baseline reads nothing about past attempts and is the control group. Static reads the set of 10 most recent settled attempts. Director reads guidance and past attempts selected by the daily review model, which compares earlier attempts. Focused reads one focus chosen by the daily review model and past attempts selected for that theme. Legend: purple is a Claude Code session (the model decides), blue is Python code (fixed rules), green is the record, and grey is external feedback.</desc>
