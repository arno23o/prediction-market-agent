# Operating configuration. Every key overrides a default in src/betting_agent/config.py,
# and environment variables prefixed BETTING_AGENT_ override this file. Clock times are
# US Eastern, the exchange's time zone. Money values are strings so they load as exact
# decimals rather than floats.

[schedule]
# The times of day (HH:MM) at which an attempt session starts: fifteen slots 96 minutes
# apart. The code default is nine slots 2h40 apart. Each slot's cell, model and effort
# come from the day's stored plan, not from this list.
slots = ["01:00", "02:36", "04:12", "05:48", "07:24", "09:00", "10:36", "12:12", "13:48", "15:24", "17:00", "18:36", "20:12", "21:48", "23:24"]
# How many minutes after its start time a slot may still launch; a slot missed by more
# is skipped. It must stay below the gap between slots, so a late slot never collides
# with the next one.
slot_grace_min = 90

[attempt]
# The model for every attempt that is not a Fable slot. `effort` is what a manual
# attempt with no slot runs.
model = "claude-opus-5-5"
effort = "high"
# Each slot's arm (model and effort) is drawn once a day together with its cell:
# `fable_per_day` slots run `fable_model` at `fable_effort`, and the other slots split
# evenly between the levels in `efforts`. Mixing arms lets the record compare them.
efforts = ["high", "max"]
fable_model = "claude-fable-5-1"
fable_per_day = 2
fable_effort = "max"
# A session that runs longer than this many minutes is stopped.
wall_time_min = 90

[limits]
# A ticket may only name markets that close within this many hours, so outcomes arrive
# while the attempt is recent enough to learn from.
max_resolve_hours = 120
# The most legs one attempt may place.
max_bets_per_attempt = 20

[stakes]
# Real orders are sent only when this is true. The code default is false, so a checkout
# without this file never trades.
live_trading = false
# The most real money, at limit prices, that all attempts together may stake in one day.
daily_real_stake_cap = "56.00"
# The most real money that may be staked on any one market in one day.
per_market_real_cap = "4.00"
# The most one attempt may stake in total at its limit prices, so that the first few
# sessions of a day cannot spend the whole daily cap.
per_attempt_real_cap = "11.20"
# Each bet is 1 to this many contracts; the session chooses the size within that range.
max_contracts_per_bet = 3
# New real orders are refused when the account's cash plus its open positions falls
# below this fraction of the balance at the start of live trading.
drawdown_floor_pct = "0.50"

[reconcile]
# The hour (0-23) from which the nightly check of the ledger against the exchange
# balance runs.
hour_et = 23
# Bands for the night's unexplained difference (drift) between the two. Up to
# `absorb_usd` it is absorbed into the balance walk with no alert; up to `halt_drift_usd`
# it raises one alert and trading continues; anything larger, or any failing
# cross-check, halts trading until an operator resumes it. Cent-sized drifts come from
# fee and stake rounding and should not stop the system.
absorb_usd = "0.50"
halt_drift_usd = "1.00"
# A watch on the absorbed drifts: one alert, never a halt, when the absorbed nights of
# the last `residual_window_days` days add up to more than `residual_alert_usd` or number
# more than `residual_alert_nights`, so many small drifts cannot hide a steady leak.
residual_alert_usd = "2.50"
residual_alert_nights = 10
residual_window_days = 30

[board]
# The board is a local cache of the exchange's market listing that sessions search. It
# is refreshed at most once per this many minutes.
refresh_min_interval_min = 60
# How many board generations to keep. Two lets `bt movers` compare the newest with the
# one before it.
generations_keep = 2
# Only markets that close within this many hours are pulled. It matches
# limits.max_resolve_hours: a market no ticket may name need not be cached.
close_bound_hours = 120
# The most settled markets kept per generation. They only feed a count in `bt series`,
# which says it is a lower bound when this cap applies.
settled_max = 2000
# Series dropped from the board, matched by name prefix. KXMVECROSS is the multi-leg
# parlay family, which floods the listing. The other six are series in which the
# exchange refused this account's orders, so researching them would waste sessions.
excluded_series = ["KXMVECROSS", "KXXIAOMISHARE", "KXBABASHARE", "KXANTHSHARE", "KXDEEPSHARE", "KXLAUNCHES", "KXSPACEXCOUNT"]
# Categories dropped from the board because the exchange refuses this account's orders
# in them. Every listing names what was excluded, so a session knows what it is not
# being shown.
excluded_categories = ["Sports", "Entertainment", "Politics"]

# How many of the day's slots run each cell. The four counts must add up to the number of
# slots above; the tick shuffles them once a day so no cell is tied to a time of day.
# `baseline` and `focused` run once a day as controls.
[cells]
baseline = 1
static = 6
director = 7
focused = 1
# How many recent attempts the static cell's context file lists.
static_recent = 10

[director]
# The daily director session reviews the previous day's attempts and writes a one-page
# direction and the sets of past attempts that the next day's cells read. It runs at
# `hour_et` (HH:MM), between the last slot of one day and the first of the next.
model = "claude-fable-5-1"
effort = "xhigh"
hour_et = "00:00"
# Limits on one director run: turns, spend in dollars, and minutes.
max_turns = 120
max_budget_usd = "40.00"
wall_time_min = 45
# Parsed but not read by the code; the size of the example sets is set in the director
# prompt.
set_size = 10
# The longest page the director may write. A longer page fails validation and the day
# runs on the last valid page.
page_max_chars = 4000

[history]
# What `bt past` searches by default: the current era once it holds at least
# `era_default_min` attempts, and the whole ledger before that. The era name is stamped
# on every new attempt.
era_default_min = 50
current_era = "live-v2"

[alerts]
# Post a desktop notification on failures and halts. The thresholds keep their code
# defaults.
enabled = true
