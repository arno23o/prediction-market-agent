[project]
name = "betting-agent"
version = "0.1.0"
description = "An AI agent that places small real-money bets on a prediction market, with code-enforced limits and a ledger of every attempt."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "cryptography>=42.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "typer>=0.12",
]

[project.scripts]
betting-agent = "betting_agent.cli:app"
bt = "betting_agent.bt:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/betting_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
